name: build-runner-image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      runner_tag:
        description: summerwind/actions-runner base tag
        required: false
        default: ubuntu-24.04
      buildx_version:
        description: docker buildx version (no leading v)
        required: false
        default: "0.35.0"
      docker_version:
        description: docker CLI version to embed
        required: false
        default: 29.1.3
      awscli_version:
        description: aws-cli v2 version (or "latest")
        required: false
        default: 2.36.21
      yq_version:
        description: mikefarah/yq v4 version
        required: false
        default: 4.53.3
      platforms:
        description: comma-separated build platforms
        required: false
        default: linux/amd64,linux/arm64

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RUNNER_TAG: ${{ inputs.runner_tag || 'ubuntu-24.04' }}
  BUILDX_VERSION: ${{ inputs.buildx_version || '0.35.0' }}
  DOCKER_VERSION: ${{ inputs.docker_version || '29.1.3' }}
  AWSCLI_VERSION: ${{ inputs.awscli_version || '2.36.21' }}
  YQ_VERSION: ${{ inputs.yq_version || '4.53.3' }}
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Non-native arches are emulated. The Dockerfile only downloads prebuilt
      # binaries, so emulation cost is a few seconds, not a full compile.
      - name: Set up QEMU
        if: contains(env.PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -eu
          image="${REGISTRY}/${IMAGE_NAME}"
          image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
          # sha-<short> is the immutable reference to pin in ARC manifests;
          # the others are mutable and move with each build.
          versioned="${RUNNER_TAG}-buildx${BUILDX_VERSION}-docker${DOCKER_VERSION}-aws${AWSCLI_VERSION}-yq${YQ_VERSION}"
          {
            echo "tags=${image}:${RUNNER_TAG},${image}:${versioned},${image}:sha-${GITHUB_SHA::7},${image}:latest"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            RUNNER_TAG=${{ env.RUNNER_TAG }}
            BUILDX_VERSION=${{ env.BUILDX_VERSION }}
            DOCKER_VERSION=${{ env.DOCKER_VERSION }}
            AWSCLI_VERSION=${{ env.AWSCLI_VERSION }}
            YQ_VERSION=${{ env.YQ_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=summerwind/actions-runner:${{ env.RUNNER_TAG }} with buildx ${{ env.BUILDX_VERSION }}, docker CLI ${{ env.DOCKER_VERSION }}, aws-cli ${{ env.AWSCLI_VERSION }}, yq ${{ env.YQ_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails the run if the pushed tag is not a manifest list covering every
      # requested platform, so a silently single-arch push cannot go unnoticed.
      - name: Verify manifest covers all platforms
        run: |
          set -euo pipefail
          ref="${{ steps.tags.outputs.image }}:${{ env.RUNNER_TAG }}"
          docker buildx imagetools inspect --raw "$ref" > /tmp/index.json
          if ! jq -e 'has("manifests")' /tmp/index.json >/dev/null; then
            echo "not a manifest list: $(jq -r '.mediaType // "?"' /tmp/index.json)" >&2
            exit 1
          fi
          got="$(jq -r '
            [ .manifests[]
              | select((.platform.os // "unknown") != "unknown")
              | .platform.os + "/" + .platform.architecture ]
            | unique | join(",")' /tmp/index.json)"
          echo "manifest platforms: $got"
          for want in $(echo "${PLATFORMS}" | tr ',' ' '); do
            case ",$got," in
              *",$want,"*) echo "ok $want" ;;
              *) echo "MISSING $want in $got" >&2; exit 1 ;;
            esac
          done

          {
            echo "### Pushed"
            echo '```'
            echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n'
            echo '```'
            echo "Platforms: \`$got\`"
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
